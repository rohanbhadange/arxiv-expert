[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "arxiv-expert"
version = "0.2.0"
description = "A self-updating, cited research expert built from an arXiv category."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "arXiv Expert contributors" }]
keywords = ["arxiv", "research", "robotics", "rag", "openai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27,<1",
  "openai>=2.15,<3",
  "platformdirs>=4.3",
  "streamlit>=1.60",
  "typer>=0.15",
]

[project.optional-dependencies]
test = [
  "build>=1.2,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9,<1",
]

[project.scripts]
arxiv-expert = "arxiv_expert.cli:app"

[project.urls]
Homepage = "https://github.com/rohanbhadange/arxiv-expert"
Issues = "https://github.com/rohanbhadange/arxiv-expert/issues"
Repository = "https://github.com/rohanbhadange/arxiv-expert.git"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_expert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["arxiv_expert"]
concurrency = ["thread"]
# Streamlit executes the page in its isolated AppTest runner. UI behavior is
# asserted in tests/test_web_ui.py; this gate measures the instrumentable core.
omit = [
  "src/arxiv_expert/__main__.py",
  "src/arxiv_expert/web.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]
